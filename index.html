<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Manisha and Neel's wedding save the date." />
    <title>Manisha &amp; Neel — Save Our Date</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="invitation">
      <div class="petals" aria-hidden="true"></div>
      <section class="hero" aria-label="Save our date">
        <img src="assets/hero.jpg" alt="Save our date — hands reaching toward each other" fetchpriority="high" />
      </section>

      <section class="names reveal" aria-label="Manisha and Neel">
        <img src="assets/name-details.png" alt="MN monogram and Manisha & Neel" />
      </section>

      <div class="scroll-hint reveal" aria-hidden="true">
        <img src="assets/scroll-down.png" alt="" />
      </div>

      <section class="date-section reveal" aria-label="Wedding dates, 3 to 5 January 2027">
        <img class="couple" src="assets/couple.png" alt="Manisha and Neel" loading="lazy" />
        <img class="date-art" src="assets/date-details.png" alt="January 3, 4, 5, 2027" loading="lazy" />
      </section>

      <section class="venue reveal">
        <img src="assets/location.png" alt="Venue: Wayanad, Kerala." loading="lazy" />
      </section>

      <section class="closing reveal" aria-label="Wedding details">
        <img class="end-art" src="assets/end.jpg" alt="As many of you will be travelling, we're sharing the dates early so you can plan your journey. We can't wait to celebrate with you. A formal invitation, along with the celebration details, will follow soon." loading="lazy" />
        <div class="countdown" aria-live="polite" aria-label="Live countdown to 3 January 2027">
          <div><strong id="days">148</strong><span>Days</span></div><i>|</i>
          <div><strong id="hours">07</strong><span>Hours</span></div><i>|</i>
          <div><strong id="minutes">40</strong><span>Minutes</span></div><i>|</i>
          <div><strong id="seconds">21</strong><span>Seconds</span></div>
        </div>
      </section>
      <footer class="footer-art">
        <a href="https://www.urbanknotsllp.com/" target="_blank" rel="noopener noreferrer" aria-label="Visit Urban Knots website">
          <img src="assets/footer.png" alt="Urban Knots — www.urbanknotsllp.com — +91 812 919 5151" loading="lazy" />
        </a>
      </footer>
    </main>
    <script src="script.js"></script>
  </body>
</html>
