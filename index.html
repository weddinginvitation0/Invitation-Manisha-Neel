<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f6f3" />
    <title>Manisha & Neel — Save Our Date</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="invitation" aria-label="Save the date invitation for Manisha and Neel">
      <div class="petals" aria-hidden="true"></div>

      <section class="hero reveal">
        <img src="assets/hero.jpg" alt="Save our date — Manisha and Neel's hands reaching for one another" />
      </section>

      <section class="introduction reveal">
        <img class="name-details scroll-reveal" src="assets/name-details.png" alt="Monogram for Manisha and Neel" />
        <div class="scroll-hint">
          <img src="assets/scroll-down.png" alt="" />
        </div>
      </section>

      <section class="date-section reveal" aria-label="Wedding dates">
        <div class="couple-photo"><img src="assets/couple.png" alt="Manisha and Neel" loading="lazy" /></div>
        <div class="date-copy">
          <img class="scroll-reveal" src="assets/date-details.png" alt="January 03, 04, 05 2027" loading="lazy" />
        </div>
      </section>

      <section class="venue reveal">
        <img class="scroll-reveal" src="assets/location.png" alt="Venue: Wayanad, Kerala" loading="lazy" />
      </section>

      <section class="closing reveal">
        <img src="assets/end.jpg" alt="Travel information and decorative floral architecture" loading="lazy" />
        <div class="countdown-wrap" aria-live="polite" aria-label="Countdown to 3 January 2027">
          <div class="countdown" id="countdown">
            <div><strong data-unit="days">000</strong><span>Days</span></div><i>|</i>
            <div><strong data-unit="hours">00</strong><span>Hours</span></div><i>|</i>
            <div><strong data-unit="minutes">00</strong><span>Minutes</span></div><i>|</i>
            <div><strong data-unit="seconds">00</strong><span>Seconds</span></div>
          </div>
        </div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
